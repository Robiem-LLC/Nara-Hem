name: Format

# Checks declaration layout, and formatting and lint for Python, JavaScript/CSS/HTML/YAML/
# Markdown and shell scripts.
# Kotlin is checked by "Android tests" (it needs the Android SDK image); Swift is checked on the
# Mac by "iOS Mac mini" validation runs.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run: your Linux runner, or GitHub's"
        type: choice
        options: [local, github]
        default: local

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pull requests, forks included, are checked on GitHub's runners; other events only here.
    if: github.event_name == 'pull_request' || github.repository == vars.NARAHEM_TRUSTED_REPOSITORY
    # Your own signed pushes and runs use your Linux runner; everything else, pull requests from
    # anyone included, uses GitHub's runners. The runner's guard enforces this; routing only picks.
    runs-on: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.actor == vars.NARAHEM_TRUSTED_ACTOR && github.triggering_actor == vars.NARAHEM_TRUSTED_ACTOR && inputs.runner != 'github' && github.event.head_commit.committer.email != 'noreply@github.com' && '["self-hosted","Linux","X64","narahem-linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r tools/format/requirements.txt
          npm ci --ignore-scripts
      - name: Check formatting and lint
        run: bash tools/format/run.sh check layout python web shell
