name: Showcase site

# Films Nära Hem with a fictional family and simulated GPS, then builds the static
# showcase site and publishes it as a small web server image,
# ghcr.io/<owner>/nara-hem-site, to run behind a Cloudflare Tunnel (site/compose.yaml).
#
#   phones  Mac mini (main/dev only; allowed by ci/runner/guard.py): the real iPhone app in
#           the iPhone Simulator and the Android app in the emulator. Never signs anything.
#   site    Linux runner: the web app in a browser, then clips, site and image.
on:
  push:
    branches: [dev, feature/showcase]
    paths:
      - 'tools/showcase/**'
      - 'site/**'
      - 'apps/ios/Showcase/**'
      - '.github/workflows/showcase.yaml'
  workflow_dispatch:
    inputs:
      phones:
        description: Also film the iPhone and Android apps on the Mac
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  phones:
    if: >-
      github.repository == vars.NARAHEM_TRUSTED_REPOSITORY &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || inputs.phones)
    runs-on: [self-hosted, macOS, ARM64, narahem-ios]
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    env:
      JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
      ANDROID_HOME: /Users/narahemci/Library/Android/sdk
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
      - name: Report failures as annotations
        # Raw logs and artifacts are not readable everywhere; annotations always are.
        run: |
          echo "OUT=$RUNNER_TEMP/phones" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/phones"
          cat > "$RUNNER_TEMP/annotate.sh" <<'EOF'
          # usage: annotate TITLE LOGFILE
          annotate() { echo "::error title=$1::$(tail -c 2500 "$2" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          EOF
      - name: Tools (Python, Node, cloudflared)
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools/bin"
          # Python 3.12 from uv, isolated from the runner's own Python.
          /usr/bin/python3 -m venv "$tools/uv"
          "$tools/uv/bin/pip" install -q uv
          "$tools/uv/bin/uv" venv -q --python 3.12 "$tools/py"
          "$tools/uv/bin/uv" pip install -q --python "$tools/py/bin/python" -r apps/webapp/backend/requirements-dev.txt pillow
          # Node 22 and cloudflared, pinned by checksum.
          curl -fsSL -o "$tools/node.tgz" https://nodejs.org/dist/v22.11.0/node-v22.11.0-darwin-arm64.tar.gz
          echo "2e89afe6f4e3aa6c7e21c560d8a0453d84807e97850bbb819b998531a22bdfde  $tools/node.tgz" | shasum -a 256 -c -
          tar -xzf "$tools/node.tgz" -C "$tools" && mv "$tools/node-v22.11.0-darwin-arm64" "$tools/node"
          curl -fsSL -o "$tools/cloudflared.tgz" https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-darwin-arm64.tgz
          echo "a2f79ff7b9420aa537d74af239f376da170bbabeb529aec416002adac6a72e70  $tools/cloudflared.tgz" | shasum -a 256 -c -
          tar -xzf "$tools/cloudflared.tgz" -C "$tools/bin"
          { echo "$tools/py/bin"; echo "$tools/node/bin"; echo "$tools/bin"; } >> "$GITHUB_PATH"
      - name: Web app bundle and browser (for the owner's trusted browser)
        run: |
          set -euo pipefail
          npm --prefix apps/webapp/frontend ci --ignore-scripts
          npm --prefix apps/webapp/frontend run build
          node apps/webapp/frontend/node_modules/playwright/cli.js install chromium
      - name: Android emulator (separate SDK; the build SDK stays untouched)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/annotate.sh"
          sdk="$HOME/Library/Caches/narahem-showcase/sdk"; mkdir -p "$sdk"
          image='system-images;android-35;google_apis;arm64-v8a'
          if [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
            unzip -q -o "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline"
            mkdir -p "$sdk/cmdline-tools" && rm -rf "$sdk/cmdline-tools/latest" && mv "$RUNNER_TEMP/cmdline/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          export PATH="$JAVA_HOME/bin:$PATH" ANDROID_SDK_ROOT="$sdk" ANDROID_HOME="$sdk" ANDROID_AVD_HOME="$sdk/avd"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$image" > "$OUT/sdkmanager.log" 2>&1 \
            || { annotate 'Android SDK install failed' "$OUT/sdkmanager.log"; exit 1; }
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n narahem-showcase -k "$image" -d pixel_7 > "$OUT/avd.log" 2>&1 \
            || { annotate 'Android emulator creation failed' "$OUT/avd.log"; exit 1; }
          echo "SHOWCASE_SDK=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$sdk/avd" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Build the iPhone app and its showcase UI test
        working-directory: apps/ios
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/annotate.sh"
          bash ci/remote/build.sh showcase-build > "$OUT/ios-build.log" 2>&1 || { annotate 'iPhone showcase build failed' "$OUT/ios-build.log"; exit 1; }
          grep '^SHOWCASE_' "$OUT/ios-build.log" >> "$GITHUB_ENV"
      - name: Build the Android app
        working-directory: apps/android
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/annotate.sh"
          cp ci/google-services.synthetic.json app/google-services.json
          PATH="$JAVA_HOME/bin:$PATH" bash gradlew :app:assembleOsmDebug --no-daemon > "$OUT/android-build.log" 2>&1 \
            || { annotate 'Android showcase build failed' "$OUT/android-build.log"; exit 1; }
      - name: Start the iPhone Simulator and the Android emulator
        # An Android emulator problem must not cost the iPhone recording: it is reported and skipped.
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/annotate.sh"
          export ANDROID_SDK_ROOT="$SHOWCASE_SDK" ANDROID_HOME="$SHOWCASE_SDK"
          "$SHOWCASE_SDK/emulator/emulator" -accel-check > "$OUT/emulator.log" 2>&1 || true
          ( "$SHOWCASE_SDK/emulator/emulator" -avd narahem-showcase -no-window -no-audio -no-boot-anim -no-snapshot \
              -gpu swiftshader_indirect -memory 3072 -cores 4 -verbose >> "$OUT/emulator.log" 2>&1 & )
          # A clean simulator each run: no learned words or addresses for the keyboard to suggest.
          xcrun simctl shutdown "$SHOWCASE_SIMULATOR" 2>/dev/null || true
          xcrun simctl erase "$SHOWCASE_SIMULATOR"
          xcrun simctl boot "$SHOWCASE_SIMULATOR"
          xcrun simctl bootstatus "$SHOWCASE_SIMULATOR" -b > /dev/null
          for key in KeyboardPrediction KeyboardShowPredictionBar KeyboardAutocorrection KeyboardAutocapitalization KeyboardCheckSpelling; do
            xcrun simctl spawn "$SHOWCASE_SIMULATOR" defaults write com.apple.Preferences "$key" -bool NO || true
          done
          booted=no
          for _ in $(seq 1 160); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=yes; break; fi
            sleep 3
          done
          if [ "$booted" = yes ] && adb install -r -g apps/android/app/build/outputs/apk/osm/debug/app-osm-debug.apk >> "$OUT/emulator.log" 2>&1; then
            echo "SHOWCASE_PHONES=ios,android" >> "$GITHUB_ENV"
          else
            { echo "--- adb devices"; adb devices 2>&1; echo "--- processes"; ps -axo pid,etime,command | grep -i '[e]mulator\|[q]emu' | cut -c1-200; } >> "$OUT/emulator.log"
            echo "::warning title=Android emulator::$(grep -v '^$' "$OUT/emulator.log" | grep -iE 'error|fail|accel|hvf|qemu|killed|---|emulator-' | tail -n 25 | cut -c1-220 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "SHOWCASE_PHONES=ios" >> "$GITHUB_ENV"
          fi
      - name: Film the phones
        working-directory: tools/showcase
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/annotate.sh"
          status=0
          python run.py phones "$OUT" > "$OUT/run.log" 2>&1 || status=$?
          # The throwaway server's one-time setup token has no place in reports.
          sed -i '' '/SETUP TOKEN/d' "$OUT/run.log"
          if [ "$status" != 0 ]; then
            annotate 'Phone filming failed' "$OUT/run.log"
            if [ -f "$OUT/ios-screen.log" ]; then annotate 'iPhone screen when the test gave up' "$OUT/ios-screen.log"; fi
            if [ -f "$OUT/ios-typed.log" ]; then annotate 'iPhone typing mismatch' "$OUT/ios-typed.log"; fi
            if [ -f "$OUT/android-screen.log" ]; then annotate 'Android screen when it gave up' "$OUT/android-screen.log"; fi
            if [ -f "$OUT/ios-test.log" ]; then
              grep -E 'error|failed|Not found|None found|XCT' "$OUT/ios-test.log" | tail -n 30 > "$OUT/ios-test-errors.log" || true
              annotate 'iPhone UI test' "$OUT/ios-test-errors.log"
            fi
          fi
          echo "::notice title=Phone recording::$(cat "$OUT/summary.txt" 2>/dev/null) videos: $(cd "$OUT" && ls *.mp4 2>/dev/null | tr '\n' ' ')"
          exit "$status"
      - name: Shut down the emulator and simulator
        if: always()
        run: |
          adb emu kill 2>/dev/null || true
          [ -n "${SHOWCASE_SIMULATOR:-}" ] && xcrun simctl shutdown "$SHOWCASE_SIMULATOR" 2>/dev/null || true
      - name: Keep only the newest build files (oldest deleted first)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP: ${{ vars.NARAHEM_ARTIFACT_KEEP || '5' }}
        run: python3 ci/keep_artifacts.py --keep "$KEEP" showcase-phones
      - name: Upload the phone recordings
        if: always()
        # When GitHub's artifact storage is full, the site keeps the phone videos it already has.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showcase-phones
          path: |
            ${{ runner.temp }}/phones/*.mp4
            ${{ runner.temp }}/phones/*.json
            ${{ runner.temp }}/phones/*.log
          retention-days: 14
          if-no-files-found: ignore

  site:
    needs: phones
    if: always() && github.repository == vars.NARAHEM_TRUSTED_REPOSITORY
    runs-on: [self-hosted, Linux, X64, narahem-linux]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r apps/webapp/backend/requirements-dev.txt pillow
          npm --prefix apps/webapp/frontend ci --ignore-scripts
          npm --prefix apps/webapp/frontend run build
          node apps/webapp/frontend/node_modules/playwright/cli.js install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -q && apt-get install -yq ffmpeg
            else sudo apt-get update -q && sudo apt-get install -yq ffmpeg; fi
          fi
      - name: Record the web app
        run: |
          set -euo pipefail
          record() {
            rm -rf "$RUNNER_TEMP/recording"
            python3 tools/showcase/run.py web "$RUNNER_TEMP/recording" > "$RUNNER_TEMP/web.log" 2>&1 || status=$?
            sed -i '/SETUP TOKEN/d' "$RUNNER_TEMP/web.log"
            cat "$RUNNER_TEMP/web.log"
            return "${status:-0}"
          }
          # One retry: a browser hiccup shouldn't cost the whole site build.
          if ! record && ! (status=0; record); then
            echo "::error title=Web recording failed::$(grep -v '^\s*$' "$RUNNER_TEMP/web.log" | tail -n 40 | cut -c1-250 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice title=Showcase recording::$(cat "$RUNNER_TEMP/recording/summary.txt")"
      - name: Record the web setup steps
        # Captioned setup videos for the setup page; the site still builds without them.
        continue-on-error: true
        run: |
          set -euo pipefail
          status=0
          python3 tools/showcase/run.py setup "$RUNNER_TEMP/recording" > "$RUNNER_TEMP/setup.log" 2>&1 || status=$?
          sed -i '/SETUP TOKEN/d' "$RUNNER_TEMP/setup.log"
          cat "$RUNNER_TEMP/setup.log"
          if [ "$status" != 0 ]; then
            echo "::warning title=Setup recording failed::$(tail -n 30 "$RUNNER_TEMP/setup.log" | cut -c1-250 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit "$status"
          fi
      - name: Fetch the phone recordings
        # Whatever was filmed: one phone's failure shouldn't hide the other's video.
        if: needs.phones.result == 'success' || needs.phones.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: showcase-phones
          path: ${{ runner.temp }}/recording
      - name: Cut clips and build the site
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN || vars.SITE_DOMAIN }}
          SITE_GOOGLE_MAPS_API_KEY: ${{ secrets.SITE_GOOGLE_MAPS_API_KEY || vars.SITE_GOOGLE_MAPS_API_KEY }}
          SITE_GITHUB: ${{ github.server_url }}/${{ github.repository }}
          NARAHEM_IOS_APP_URL: ${{ secrets.NARAHEM_IOS_APP_URL || vars.NARAHEM_IOS_APP_URL }}
          NARAHEM_ANDROID_APP_URL: ${{ secrets.NARAHEM_ANDROID_APP_URL || vars.NARAHEM_ANDROID_APP_URL || format('{0}/{1}/releases/latest/download/NaraHem-Android.apk', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          export SITE_IMAGE="ghcr.io/${OWNER,,}/narahem"
          ls -la "$RUNNER_TEMP/recording" | sed -n '1,60p'
          report() { echo "::error title=$1::$(tail -n 25 "$RUNNER_TEMP/build.log" | cut -c1-250 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          python3 tools/showcase/clips.py "$RUNNER_TEMP/recording" "$RUNNER_TEMP/media" > "$RUNNER_TEMP/build.log" 2>&1 || report 'Cutting clips failed'
          grep '^::warning' "$RUNNER_TEMP/build.log" || true
          # Phone videos not filmed this time (or lost to a full artifact store) are kept from
          # the published site rather than dropped from it.
          missing=""
          for name in ios android ios-setup android-setup; do
            [ -e "$RUNNER_TEMP/media/$name.mp4" ] || missing="$missing $name"
          done
          previous="ghcr.io/${GITHUB_REPOSITORY,,}-site:latest"
          if [ -n "$missing" ] && printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 && docker pull -q "$previous" >/dev/null 2>&1; then
            box="$(docker create "$previous")"
            for name in $missing; do
              for type in mp4 png; do
                docker cp "$box:/usr/share/nginx/html/media/$name.$type" "$RUNNER_TEMP/media/" >/dev/null 2>&1 || true
              done
              if [ -e "$RUNNER_TEMP/media/$name.mp4" ]; then echo "::notice title=Phone video::Kept the published $name video"; fi
            done
            docker rm "$box" >/dev/null
          fi
          docker logout ghcr.io >/dev/null 2>&1 || true
          python3 site/build.py "$RUNNER_TEMP/media" "$RUNNER_TEMP/site" > "$RUNNER_TEMP/build.log" 2>&1 || report 'Building the site failed'
          du -sh "$RUNNER_TEMP/site" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only the newest build files (oldest deleted first)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP: ${{ vars.NARAHEM_ARTIFACT_KEEP || '5' }}
        run: python3 ci/keep_artifacts.py --keep "$KEEP" showcase-site showcase-recording
      - name: Upload the site
        # A copy to download; the published image doesn't depend on it.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showcase-site
          path: ${{ runner.temp }}/site
          retention-days: 7
      - name: Upload the raw recording
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showcase-recording
          path: ${{ runner.temp }}/recording
          retention-days: 3
      - name: Publish the site image
        # Only builds that filmed the phones publish; branch previews are artifacts only.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Surface the reason for a failure as an annotation on the run.
          log="$RUNNER_TEMP/site-image.log"
          trap 'echo "::error title=Site image::$(tail -c 1500 "$log" | tr "\n" " ")"' ERR
          exec > >(tee "$log") 2>&1
          image="ghcr.io/${GITHUB_REPOSITORY,,}-site"
          context="$RUNNER_TEMP/site-image"
          rm -rf "$context" && mkdir -p "$context"
          cp site/Dockerfile site/nginx.conf "$context/"
          cp -r "$RUNNER_TEMP/site" "$context/site"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --progress=plain --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:sha-$GITHUB_SHA" -t "$image:latest" "$context"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          docker logout ghcr.io >/dev/null
          echo "Published site image: $image:latest" >> "$GITHUB_STEP_SUMMARY"
