name: Android tests

# Compile and unit-test Android changes before they reach main.
# Runs inside a pinned Android SDK image, on the Linux runner or GitHub's (see runs-on).
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-tests.yaml'
  push:
    branches: [dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-tests.yaml'
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run: your Linux runner, or GitHub's"
        type: choice
        options: [local, github]
        default: local

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    # Pull requests, forks included, are checked on GitHub's runners; other events only here.
    if: github.event_name == 'pull_request' || github.repository == vars.NARAHEM_TRUSTED_REPOSITORY
    # Your own signed pushes and runs use your Linux runner; everything else, pull requests from
    # anyone included, uses GitHub's runners. The runner's guard enforces this; routing only picks.
    runs-on: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.actor == vars.NARAHEM_TRUSTED_ACTOR && github.triggering_actor == vars.NARAHEM_TRUSTED_ACTOR && inputs.runner != 'github' && github.event.head_commit.committer.email != 'noreply@github.com' && '["self-hosted","Linux","X64","narahem-linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic Firebase config (unit tests never contact Firebase)
        run: cp apps/android/ci/google-services.synthetic.json apps/android/app/google-services.json
      - name: Kotlin style, unit tests and lint (both map flavors, no real keys)
        shell: bash
        # Without a Maps key only the osm flavor is enabled, so the google flavor gets a second
        # run with a synthetic key; no secrets are used. The image
        # runs as root so it can write the checkout; ownership is handed back afterwards so
        # the next checkout can clean it. The Gradle cache persists in a DinD volume.
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/apps/android" \
            -v narahem-android-gradle:/gradle -e GRADLE_USER_HOME=/gradle \
            -e OWNER="$(id -u):$(id -g)" -e CHECKOUT="$GITHUB_WORKSPACE" \
            cimg/android:2026.10.1@sha256:4e5677b17e50ea9b478f9b88071cf58dbd751ae4d62f296c676dd47e99a88e4b \
            bash -c 'status=0; { bash gradlew :app:ktlintCheck :app:testOsmDebugUnitTest :app:lintOsmDebug --no-daemon && NARAHEM_GOOGLE_MAPS_ANDROID_API_KEY=synthetic-ci-key-not-for-device-use bash gradlew :app:testGoogleDebugUnitTest :app:lintGoogleDebug :app:lintVitalGoogleRelease :app:assembleGooglePreview --no-daemon; } || status=$?; chown -R "$OWNER" "$CHECKOUT"; exit $status'
