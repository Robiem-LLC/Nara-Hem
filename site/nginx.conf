server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The home page is the demo: it loads OpenStreetMap tiles and the filmed app videos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; media-src 'self'; frame-src 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }
    # Pages, scripts, styles and the demo data change with each site build: always check for a
    # newer copy, so visitors never keep an old page after an update.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; media-src 'self'; frame-src 'self'; frame-ancestors 'self'" always;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
}
