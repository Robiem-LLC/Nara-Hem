name: NaraHem
options:
  bundleIdPrefix: com.robiem
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    # iPhone only: iPads run it in iPhone mode, and App Store review needs no iPad layouts or screenshots.
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.11.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk.git
    from: 11.0.0
targets:
  NaraHem:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Sodium
      - package: GoogleMaps
      - target: NaraHemNotifications
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Nära Hem
        NARAHEM_GOOGLE_MAPS_IOS_API_KEY: '$(NARAHEM_GOOGLE_MAPS_IOS_API_KEY)'
        NARAHEM_BUILD_UTC: '$(NARAHEM_BUILD_UTC)'
        NARAHEM_BUILD_COMMIT: '$(NARAHEM_BUILD_COMMIT)'
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - googlechromes
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSAlarmKitUsageDescription: Allow Nära Hem to schedule an audible Find My Phone system alarm after a verified request from your approved household. You can disable this in Settings.
        NSCameraUsageDescription: Take a profile picture only when you choose to share one with approved household members.
        NSLocationWhenInUseUsageDescription: Nära Hem shows your location on your own map when you choose to allow it.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allow continuous encrypted location sharing with your approved household, including while Nära Hem is in the background. You can stop sharing at any time.
        UIBackgroundModes:
          - location
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Same rotation iOS allowed when nothing was declared; App Store Connect requires it explicit.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robiem.narahem
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_ENTITLEMENTS: Resources/NaraHem.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        NARAHEM_APNS_ENVIRONMENT: development
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
      # Signing must be app-target scoped. Never pass these settings globally
      # to xcodebuild: Swift Package resource bundles (Google Maps) cannot use
      # an Ad Hoc app provisioning profile.
      configs:
        Release:
          NARAHEM_APNS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: '$(NARAHEM_SIGNING_TEAM_ID)'
          PROVISIONING_PROFILE_SPECIFIER: '$(NARAHEM_SIGNING_PROFILE_UUID)'
  # Notification service extension: decrypts a pushed household alert on the
  # iPhone ("Android left Home") and replaces the placeholder text before it is shown.
  NaraHemNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - '*.entitlements'
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: NotificationService/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Code shared with the app (crypto, records, API, storage) lives in Sources/Shared.
      - path: Sources/Shared
    dependencies:
      - package: Sodium
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Nära Hem alerts
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).NotificationService'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robiem.narahem.notifications
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_ENTITLEMENTS: NotificationService/Alerts.entitlements
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: '$(NARAHEM_SIGNING_TEAM_ID)'
          PROVISIONING_PROFILE_SPECIFIER: '$(NARAHEM_EXTENSION_PROFILE_UUID)'
  NaraHemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: NaraHem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robiem.narahem.tests
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
