# Nära Hem: minimal Portainer / Docker Compose stack.
# Put HTTPS in front of it yourself (Cloudflare Tunnel, reverse proxy, ...).
# Set the variables in Portainer's "Environment variables" (or a private
# .env), never in this file. Anything marked #optional has a default.

services:
  narahem:
    image: ${NARAHEM_IMAGE:?Set NARAHEM_IMAGE to the published server image, e.g. ghcr.io/OWNER/nara-hem}:${NARAHEM_TAG:-latest} #required NARAHEM_IMAGE; optional tag: latest | dev
    restart: unless-stopped
    init: true
    environment:
      NARAHEM_PUBLIC_URL: ${NARAHEM_PUBLIC_URL:?exact HTTPS address, e.g. https://narahem.example.com}
      DATABASE_URL: postgresql+psycopg://narahem:${NARAHEM_DB_PASSWORD:?long random password}@database:5432/narahem
      NARAHEM_GOOGLE_MAPS_API_KEY: ${NARAHEM_GOOGLE_MAPS_API_KEY:-} #optional: your own browser key; blank = OpenStreetMap
      NARAHEM_TEXTBELT_KEY: ${NARAHEM_TEXTBELT_KEY:-} #optional: Textbelt key for text messages; overrides Admin settings
      NARAHEM_ALLOW_ALEXA: ${NARAHEM_ALLOW_ALEXA:-false} #optional: true lets you link an Alexa skill (docs/alexa.md)
    volumes:
      - ${NARAHEM_DIR:-/opt/docker/narahem}/server-data:/data #optional base folder: keys, keep private
      - ${NARAHEM_DIR:-/opt/docker/narahem}/exports:/exports # readable redacted reports, safe to share
    ports:
      - '${NARAHEM_PORT:-8186}:8080' #optional: plain HTTP, only for your proxy/tunnel
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: narahem
      POSTGRES_DB: narahem
      POSTGRES_PASSWORD: ${NARAHEM_DB_PASSWORD:?long random password}
    volumes:
      - ${NARAHEM_DIR:-/opt/docker/narahem}/database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U narahem -d narahem']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
